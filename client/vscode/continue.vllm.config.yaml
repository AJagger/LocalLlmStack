name: Local vLLM
version: 1.0.0
schema: v1

models:
  - name: Local General
    provider: vllm
    model: AUTODETECT
    apiBase: http://127.0.0.1:8001/v1
    apiKey: sk-local

    roles:
      - chat
      - edit
      - apply

    capabilities:
      - tool_use

    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

  - name: Local Autocomplete
    provider: vllm
    model: AUTODETECT
    apiBase: http://127.0.0.1:8002/v1
    apiKey: sk-local

    roles:
      - autocomplete

    useLegacyCompletionsEndpoint: true
    maxStopWords: 9

    defaultCompletionOptions:
      temperature: 0.01
      maxTokens: 256
