x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 180s

x-common-vllm-config: &vllm-common
  image: vllm/vllm-openai:v0.26.0
  expose:
    - "8000"
  networks:
    - internal-llm-stack
  volumes:
    - type: bind
      source: ${MODEL_DIR:?MODEL_DIR must be set in .env}
      target: /models
      read_only: true
  environment:
    HF_HUB_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  healthcheck: *vllm-healthcheck
  restart: unless-stopped

services:
  vllm-general:
    <<: *vllm-common
    shm_size: 16gb
    command:
      - --model=/models/Qwen3.6-27B-NVFP4
      - --served-model-name=general
      - --max-model-len=16384
      - --gpu-memory-utilization=0.84
      - --max-num-seqs=8
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      <<: *vllm-healthcheck
      start_period: 600s  #Larger model requires a longer startup period
      
  vllm-autocomplete:
    <<: *vllm-common
    image: vllm/vllm-openai:v0.6.6
    shm_size: 8gb
    command:
      - --model=/models/Qwen2.5-Coder-1.5B
      - --served-model-name=autocomplete
      - --max-model-len=8192
      - --gpu-memory-utilization=0.2
      - --max-num-seqs=16
      - --host=0.0.0.0
      - --port=8000
    profiles:
      - disabled

  vllm-quick-chat:
    <<: *vllm-common
    shm_size: 8gb
    command:
      - --model=/models/Qwen3.5-2B
      - --served-model-name=quick-chat
      - --language-model-only
      - --max-model-len=8192
      - --gpu-memory-utilization=0.15
      - --max-num-seqs=8
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --host=0.0.0.0
      - --port=8000
    profiles:
      - all-models
      
  vllm-vision:
    <<: *vllm-common
    shm_size: 12gb
    command:
      - --model=/models/Qwen3-VL-8B-Instruct-FP8
      - --served-model-name=vision
      - --max-model-len=16384
      - --gpu-memory-utilization=0.45
      - --max-num-seqs=2
      - '--limit-mm-per-prompt={"image":2,"video":0}'
      - --mm-processor-cache-gb=-1
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      <<: *vllm-healthcheck
      start_period: 600s
    profiles:
      - all-models

  ollama-autocomplete:
    image: ollama/ollama:0.32.5
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama-autocomplete-data:/root/.ollama
      - ./ollama:/config:ro
      - ${MODEL_DIR:?MODEL_DIR must be set in .env}:/models:ro
    networks:
      - internal-llm-stack
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama show autocomplete >/dev/null 2>&1 || exit 1

  internal-model-router:
    image: nginx:alpine
    environment:
      GENERAL_MODEL: http://vllm-general:8000
      AUTOCOMPLETE_MODEL: http://ollama-autocomplete:11434
      QUICK_CHAT_MODEL: http://vllm-quick-chat:8000
      VISION_MODEL: http://vllm-vision:8000
    volumes:
      - type: bind
        source: ./internal-model-router.nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
    expose:
      - "8101"
      - "8102"
      - "8103"
      - "8014"
    networks:
      - internal-llm-stack
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  internal-model-gateway:
    image: docker.litellm.ai/berriai/litellm:latest
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - type: bind
        source: ./internal-model-gateway.litellm.config.yaml
        target: /app/config.yaml
        read_only: true
    expose:
      - "4000"
    depends_on:
      - internal-model-router
    networks:
      - internal-llm-stack
    restart: unless-stopped

  external-model-endpoint:
    image: nginx:alpine
    ports:
      - "${LLM_GATEWAY_IP:-127.0.0.1}:${LLM_GATEWAY_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./external-model-endpoint.nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - internal-model-gateway
    networks:
      - exposed
      - internal-llm-stack
    restart: unless-stopped
  
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: http://external-model-endpoint:8000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_CONFIGS: >-
        {
          "0": {
            "enable": true,
            "model_ids": [
              "general",
              "small-chat",
              "vision"
            ],
            "tags": [
              "Local"
            ]
          }
        }
      TASK_MODEL_EXTERNAL: general
      OFFLINE_MODE: true
      HF_HUB_OFFLINE: "1"
      ENABLE_PERSISTENT_CONFIG: "false"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - external-model-endpoint
    networks:
      - exposed
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  open-webui-data:
  ollama-autocomplete-data:

networks:
  exposed:
    driver: bridge
  internal-llm-stack:
    driver: bridge
    internal: true
