x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 180s

x-common-vllm-config: &vllm-common
  image: vllm/vllm-openai:v0.26.0
  expose:
    - "8000"
  networks:
    - internal-llm-stack
  volumes:
    - type: bind
      source: ${MODEL_DIR:?MODEL_DIR must be set in .env}
      target: /models
      read_only: true
  environment:
    HF_HUB_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  healthcheck: *vllm-healthcheck
  restart: unless-stopped

services:
  vllm-general:
    <<: *vllm-common
    shm_size: 16gb
    command:
      - --model=/models/Qwen3.5-2B
      - --served-model-name=general
      - --max-model-len=16384
      - --gpu-memory-utilization=0.75
      - --max-num-seqs=8
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      <<: *vllm-healthcheck
      start_period: 600s  #Larger model requires a longer startup period
      
  vllm-autocomplete:
    <<: *vllm-common
    image: vllm/vllm-openai:v0.6.6
    shm_size: 8gb
    command:
      - --model=/models/Qwen2.5-Coder-1.5B
      - --served-model-name=autocomplete
      - --max-model-len=8192
      - --gpu-memory-utilization=0.2
      - --max-num-seqs=16
      - --host=0.0.0.0
      - --port=8000
              
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: http://vllm-general:8000/v1
      OPENAI_API_KEY: sk-placeholder
      OFFLINE_MODE: true
      HF_HUB_OFFLINE: "1"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      vllm-general:
        condition: service_healthy
    networks:
      - exposed
      - internal-llm-stack
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${PROXY_IP:-127.0.0.1}:${PROXY_GENERAL_MODEL_PORT:-8001}:8001"
      - "${PROXY_IP:-127.0.0.1}:${PROXY_AUTOCOMPLETE_MODEL_PORT:-8002}:8002"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - exposed
      - internal-llm-stack
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  open-webui-data:

networks:
  exposed:
    driver: bridge
  internal-llm-stack:
    driver: bridge
    internal: true
