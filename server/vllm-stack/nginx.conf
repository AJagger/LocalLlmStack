# This file is mounted at:
# /etc/nginx/conf.d/default.conf
#
# The official Nginx image includes files from that location inside its
# main `http {}` configuration block.

# Docker's embedded DNS server.
#
# The use of variables in proxy_pass defers name resolution until a
# request arrives. This is helpful because your vLLM services are
# profile-gated and may not exist when Nginx initially starts.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;

# --------------------------------------------------------------------
# General/chat model
#
# Client base URL:
# http://SERVER:8001/v1
#
# Examples:
# GET  http://SERVER:8001/v1/models
# POST http://SERVER:8001/v1/chat/completions
# --------------------------------------------------------------------
server {
    listen 8001;
    server_name _;

    # Allows larger prompts and optional multimodal request bodies.
    client_max_body_size 50m;

    location / {
        set $general_backend http://vllm-general:8000;

        # Preserve the original path, for example:
        # /v1/chat/completions
        proxy_pass $general_backend$request_uri;

        proxy_http_version 1.1;

        # Permit reusable upstream connections.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward the bearer API key to vLLM.
        proxy_set_header Authorization $http_authorization;

        # Important for streamed tokens.
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# --------------------------------------------------------------------
# Autocomplete model
#
# Client base URL:
# http://SERVER:8002/v1
#
# Examples:
# GET  http://SERVER:8002/v1/models
# POST http://SERVER:8002/v1/completions
# --------------------------------------------------------------------
server {
    listen 8002;
    server_name _;

    client_max_body_size 20m;

    location / {
        set $autocomplete_backend http://vllm-autocomplete:8000;

        proxy_pass $autocomplete_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
